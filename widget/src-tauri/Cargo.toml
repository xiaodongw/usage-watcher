# Deliberately its own workspace, not a member of the root one: building it
# needs the platform webview toolchain (webkit2gtk on Linux), which the daemon
# and CLI do not, and a WSL checkout typically has none of it. Keeping it
# separate means `cargo test` at the repo root stays green everywhere.
[workspace]

[package]
name = "usage-watcher-widget"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

# Everything lives in the library; `main.rs` is four lines in front of it.
# Android links the app as a `cdylib` and iOS as a `staticlib`, neither of which
# runs a Rust `main`, so a binary-only crate cannot be built for mobile at all.
[lib]
name = "usage_watcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Named explicitly, and not after the package. This is the file someone
# double-clicks after unzipping, so it has to read as the product rather than
# as a crate — `usage-watcher.exe`, not `usage-watcher-widget.exe`.
[[bin]]
name = "usage-watcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
tauri-plugin-notification = "2"
# Opening the OAuth consent page in the user's real browser. It has to be the
# real one: the webview has no session with the provider.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only. `single-instance` has no meaning where the OS already enforces
# one process per app, `autostart` has no equivalent concept, and there is no
# tray to draw an icon in — asking for any of them unconditionally is asking
# the Android and iOS builds to fail. Cargo unions the features it finds here
# with the base entry above, so `tauri` gains `tray-icon` on desktop only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

# The collector, linked in rather than shipped as a second executable — see
# `src/daemon.rs`. Desktop only: the mobile builds have no keychain integration
# and no loopback redirect to catch an OAuth callback on, so a phone stays a
# viewer of a daemon somewhere else.
uwd = { path = "../../crates/uwd" }
# `reqwest` is reached through `uw_core::reqwest` rather than depended on
# directly, so there can only ever be one version of it in the binary.
uw-core = { path = "../../crates/uw-core" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
